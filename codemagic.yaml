workflows:
  human-mind-ai-android:
    name: HUMAN MIND AI - Android AAB
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      vars:
        PACKAGE_NAME: "com.novexa.humanmindai"
      android_signing:
        # Add your Codemagic Android keystore reference here for a signed AAB.
        # - human_mind_ai_keystore

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Show project configuration
        script: |
          echo "Package: $PACKAGE_NAME"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Gradle:"
          ./gradlew --version

      - name: Build HUMAN MIND AI release AAB
        script: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/**
      - app/build/outputs/logs/**

    publishing:
      email:
        recipients:
          - $CM_COMMIT_AUTHOR_EMAIL
        notify:
          success: true
          failure: true
